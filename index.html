<!DOCTYPEhtml>
<htmllang="en">
<head>
<metacharset="UTF-8">
<metaname="viewport"content="width=device-width,initial-scale=1.0">
<title>MyPrivateNotes</title>

<scriptsrc="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
}

header{
padding:16px;
background:#222;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
}

headerh1{
margin:0;
font-size:20px;
}

button{
border:none;
border-radius:8px;
padding:10px14px;
cursor:pointer;
background:#222;
color:white;
margin:4px;
}

.container{
max-width:900px;
margin:auto;
padding:16px;
}

#login,
#app{
display:none;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:02px10pxrgba(0,0,0,0.08);
margin-top:30px;
}

input,
textarea{
width:100%;
padding:12px;
margin:8px0;
border:1pxsolid#ccc;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:250px;
resize:vertical;
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.note{
background:white;
padding:14px;
border-radius:10px;
margin-top:10px;
box-shadow:01px5pxrgba(0,0,0,0.08);
}

.noteh3{
margin:006px;
}

.danger{
background:#b00020;
}

.secondary{
background:#666;
}

#status,
#loginStatus{
margin-top:10px;
font-size:14px;
}

@media(max-width:600px){
headerh1{
font-size:17px;
}
}
</style>
</head>

<body>

<header>
<h1>🔐MyPrivateNotes</h1>

<buttonid="logoutBtn"onclick="logout()"style="display:none;">
Logout
</button>
</header>

<divclass="container">

<divid="login"class="card">
<h2>🔐Login</h2>

<input
type="email"
id="email"
placeholder="Email"
autocomplete="email"
>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password"
>

<buttononclick="login()">Login</button>

<divid="loginStatus"></div>
</div>


<divid="app">

<divclass="card">
<h2>📝NewNote</h2>

<input
type="text"
id="title"
placeholder="Notetitle"
>

<textarea
id="content"
placeholder="Writeyournote..."
></textarea>

<divclass="row">
<buttononclick="saveNote()">💾SaveNote</button>
<buttonclass="secondary"onclick="clearEditor()">Clear</button>
</div>

<divid="status"></div>
</div>


<divclass="card">
<h2>🔎MyNotes</h2>

<input
type="text"
id="search"
placeholder="Searchnotes..."
oninput="loadNotes()"
>

<divid="notesList"></div>
</div>

</div>

</div>


<script>

//========================================
//SUPABASECONNECTION
//========================================

constSUPABASE_URL=
"https://neadherlqwnqafiwalov.supabase.co";

constSUPABASE_PUBLISHABLE_KEY=
"sb_publishable_VA8wWt0-R6IFPPPYfW0Bdg_LS0NYrl4";

constsupabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


//========================================
//STARTAPP
//========================================

asyncfunctionstartApp(){

const{
data:{session}
}=awaitsupabaseClient.auth.getSession();

if(session){
showApp();
}else{
showLogin();
}
}


functionshowLogin(){

document.getElementById("login").style.display="block";

document.getElementById("app").style.display="none";

document.getElementById("logoutBtn").style.display="none";
}


functionshowApp(){

document.getElementById("login").style.display="none";

document.getElementById("app").style.display="block";

document.getElementById("logoutBtn").style.display="block";

loadNotes();
}


//========================================
//LOGIN
//========================================

asyncfunctionlogin(){

constemail=
document.getElementById("email").value.trim();

constpassword=
document.getElementById("password").value;

conststatus=
document.getElementById("loginStatus");

if(!email||!password){

status.textContent=
"Pleaseenteryouremailandpassword.";

return;
}

status.textContent="Loggingin...";

const{error}=
awaitsupabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){

status.textContent=
"❌"+error.message;

return;
}

status.textContent="";

showApp();
}


//========================================
//LOGOUT
//========================================

asyncfunctionlogout(){

awaitsupabaseClient.auth.signOut();

clearEditor();

showLogin();
}


//========================================
//SAVENOTE
//========================================

asyncfunctionsaveNote(){

consttitle=
document.getElementById("title").value.trim();

constcontent=
document.getElementById("content").value.trim();

conststatus=
document.getElementById("status");

if(!title&&!content){

status.textContent=
"Writesomethingfirst.";

return;
}

const{
data:{user}
}=awaitsupabaseClient.auth.getUser();

if(!user){

status.textContent=
"Pleaseloginagain.";

return;
}

status.textContent="Saving...";

const{error}=
awaitsupabaseClient
.from("notes")
.insert({
user_id:user.id,
title:title,
content:content
});

if(error){

status.textContent=
"❌"+error.message;

return;
}

status.textContent=
"✅Notesaved!";

clearEditor();

loadNotes();
}


//========================================
//LOADNOTES
//========================================

asyncfunctionloadNotes(){

constsearch=
document.getElementById("search").value
.toLowerCase()
.trim();

const{
data:{user}
}=awaitsupabaseClient.auth.getUser();

if(!user)return;

const{
data,
error
}=awaitsupabaseClient
.from("notes")
.select("*")
.eq("user_id",user.id)
.order("updated_at",{
ascending:false
});

constlist=
document.getElementById("notesList");

if(error){

list.innerHTML=
"❌"+error.message;

return;
}

constfiltered=
data.filter(note=>

(note.title||"")
.toLowerCase()
.includes(search)

||

(note.content||"")
.toLowerCase()
.includes(search)
);

if(filtered.length===0){

list.innerHTML=
"<p>Nonotesfound.</p>";

return;
}

list.innerHTML="";

filtered.forEach(note=>{

constdiv=
document.createElement("div");

div.className="note";


consttitle=
document.createElement("h3");

title.textContent=
note.title||"Untitled";


constcontent=
document.createElement("p");

content.textContent=
(note.content||"").substring(0,150);


consteditButton=
document.createElement("button");

editButton.textContent=
"✏️Edit";

editButton.onclick=
()=>editNote(note.id);


constdeleteButton=
document.createElement("button");

deleteButton.textContent=
"🗑️Delete";

deleteButton.className=
"danger";

deleteButton.onclick=
()=>deleteNote(note.id);


div.appendChild(title);

div.appendChild(content);

div.appendChild(editButton);

div.appendChild(deleteButton);

list.appendChild(div);
});
}


//========================================
//EDITNOTE
//========================================

asyncfunctioneditNote(id){

const{
data,
error
}=awaitsupabaseClient
.from("notes")
.select("*")
.eq("id",id)
.single();

if(error){

alert(error.message);

return;
}

document.getElementById("title").value=
data.title||"";

document.getElementById("content").value=
data.content||"";

window.scrollTo({
top:0,
behavior:"smooth"
});
}


//========================================
//DELETENOTE
//========================================

asyncfunctiondeleteNote(id){

if(!confirm("Deletethisnote?")){
return;
}

const{error}=
awaitsupabaseClient
.from("notes")
.delete()
.eq("id",id);

if(error){

alert(error.message);

return;
}

loadNotes();
}


//========================================
//CLEAREDITOR
//========================================

functionclearEditor(){

document.getElementById("title").value="";

document.getElementById("content").value="";

document.getElementById("status").textContent="";
}


//========================================
//START
//========================================

startApp();

</script>

</body>
</html>
