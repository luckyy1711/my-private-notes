<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notes</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons (Phosphor Icons - clean & modern) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Rich Text Editor (Quill Bubble Theme for a minimal UI) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.bubble.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    
    <!-- Supabase JS -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Auth View -->
    <div id="auth-view" class="view-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="ph-fill ph-notebook" style="font-size: 32px;"></i>
                <h1>Welcome Back</h1>
                <p>Sign in to your private notes</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
                <div id="auth-error" class="error-text"></div>
            </form>
        </div>
    </div>

    <!-- Main App View -->
    <div id="app-view" class="view-container hidden">
        
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="app-brand">
                    <i class="ph-fill ph-notebook"></i>
                    <span>Notes</span>
                </div>
                <button class="icon-btn" id="sidebar-close-btn" title="Close Sidebar"><i class="ph ph-x"></i></button>
            </div>
            
            <div class="sidebar-search">
                <button id="global-search-btn" class="search-trigger">
                    <i class="ph ph-magnifying-glass"></i>
                    <span>Search...</span>
                    <kbd>⌘K</kbd>
                </button>
            </div>

            <div class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item active" data-filter="all">
                        <i class="ph ph-files"></i> All Notes
                    </li>
                    <li class="nav-item" data-filter="favorites">
                        <i class="ph ph-star"></i> Favorites
                    </li>
                    <li class="nav-item" data-filter="recent">
                        <i class="ph ph-clock"></i> Recent
                    </li>
                </ul>

                <div class="nav-section">
                    <div class="nav-section-header">
                        <span>Folders</span>
                        <button class="icon-btn small" id="new-folder-btn"><i class="ph ph-plus"></i></button>
                    </div>
                    <ul class="nav-list" id="folder-list">
                        <!-- Folders injected here -->
                    </ul>
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="nav-item" id="theme-toggle">
                    <i class="ph ph-moon"></i> <span>Toggle Theme</span>
                </button>
                <button class="nav-item" id="logout-btn">
                    <i class="ph ph-sign-out"></i> <span>Log Out</span>
                </button>
            </div>
        </nav>

        <!-- Note List Panel -->
        <aside id="note-list-panel" class="note-list-panel">
            <div class="panel-header">
                <div class="mobile-controls">
                    <button class="icon-btn" id="mobile-menu-btn"><i class="ph ph-list"></i></button>
                </div>
                <h2 id="current-view-title">All Notes</h2>
                <button class="icon-btn new-note-btn" title="Create Note"><i class="ph ph-note-pencil"></i></button>
            </div>
            <div class="list-controls">
                <span id="note-count">0 notes</span>
                <select id="sort-select" class="clean-select">
                    <option value="updated">Recently Updated</option>
                    <option value="created">Recently Created</option>
                    <option value="alpha">Alphabetical</option>
                </select>
            </div>
            <div class="notes-scroll-area" id="notes-list-container">
                <!-- Notes injected here -->
            </div>
        </aside>

        <!-- Editor Panel -->
        <main id="editor-panel" class="editor-panel">
            <!-- Empty State -->
            <div id="editor-empty" class="editor-empty">
                <i class="ph ph-note-pencil"></i>
                <p>Select a note or create a new one</p>
                <button class="btn-primary new-note-btn">Create Note</button>
            </div>

            <!-- Active Editor -->
            <div id="editor-active" class="editor-active hidden">
                <header class="editor-header">
                    <div class="editor-header-left">
                        <button class="icon-btn mobile-only" id="back-to-list-btn"><i class="ph ph-caret-left"></i></button>
                        <span class="save-status" id="save-status">Saved</span>
                    </div>
                    <div class="editor-header-right">
                        <button class="icon-btn" id="toggle-favorite-btn" title="Toggle Favorite"><i class="ph ph-star"></i></button>
                        <button class="icon-btn" id="toggle-pin-btn" title="Toggle Pin"><i class="ph ph-push-pin"></i></button>
                        <div class="dropdown">
                            <button class="icon-btn" id="more-options-btn"><i class="ph ph-dots-three"></i></button>
                            <div class="dropdown-menu hidden" id="more-options-menu">
                                <a href="#" id="duplicate-note-action"><i class="ph ph-copy"></i> Duplicate</a>
                                <a href="#" id="delete-note-action" class="danger"><i class="ph ph-trash"></i> Delete</a>
                            </div>
                        </div>
                    </div>
                </header>
                
                <div class="editor-scroll-area">
                    <div class="editor-content-wrapper">
                        <input type="text" id="note-title-input" class="note-title-input" placeholder="Note Title" autocomplete="off">
                        <div id="quill-editor"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Search Modal -->
    <div id="search-modal" class="modal-overlay hidden">
        <div class="search-dialog">
            <div class="search-input-wrapper">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="global-search-input" placeholder="Search notes..." autocomplete="off">
                <kbd>ESC</kbd>
            </div>
            <div class="search-results" id="search-results">
                <!-- Results injected here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="app.js"></script>
</body>
</html>
